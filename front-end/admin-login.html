<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - MCIU Hostel Portal</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)),
                url("photo/mciu.jpg") center/cover no-repeat;
        }

        .login-container {
            width: 420px;
            max-width: 92%;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
        }

        .logo-section {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            width: 85px;
            height: 85px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #d4af37;
            margin-bottom: 15px;
        }

        h1 {
            color: #1f2937;
            font-size: 26px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
        }

        .admin-badge {
            display: inline-block;
            margin-top: 12px;
            padding: 6px 14px;
            border-radius: 20px;
            background: #fff8e1;
            color: #856404;
            font-size: 13px;
            font-weight: bold;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #374151;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #d4af37;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.25);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #d4af37;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #b8962f;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            min-height: 22px;
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: 600;
        }

        .error {
            color: #dc2626;
        }

        .success {
            color: #16a34a;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #1f2937;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back-link a:hover {
            color: #d4af37;
        }

        @media (max-width: 500px) {
            .login-container {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo-section">

            <img
                src="photo/mciu.jpg"
                class="logo"
                alt="MCIU Logo"
            >

            <h1>Admin Login</h1>

            <p class="subtitle">
                MCIU Hostel Management System
            </p>

            <span class="admin-badge">
                ADMINISTRATOR ACCESS
            </span>

        </div>

        <p id="message"></p>

        <form id="adminLoginForm">

            <div class="input-group">

                <label for="username">
                    Admin Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter admin username"
                    autocomplete="username"
                    required
                >

            </div>

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter admin password"
                    autocomplete="current-password"
                    required
                >

            </div>

            <button
                type="submit"
                id="loginButton"
            >
                Login as Administrator
            </button>

        </form>

        <div class="back-link">

            <a href="login.html">
                ← Back to Student Login
            </a>

        </div>

    </div>


    <script>

        const form =
            document.getElementById("adminLoginForm");

        const message =
            document.getElementById("message");

        const loginButton =
            document.getElementById("loginButton");


        form.addEventListener("submit", async function (event) {

            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;


            message.textContent = "";
            message.className = "";

            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";


            try {

                const response = await fetch(
                    "/admin/login",
                    {
                        method: "POST",

                        credentials: "include",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            username,
                            password
                        })
                    }
                );


                const data =
                    await response.json();


                if (data.success) {

                    message.className = "success";

                    message.textContent =
                        "Admin login successful. Redirecting...";


                    setTimeout(function () {

                        window.location.href =
                            "/admin.html";

                    }, 700);

                } else {

                    message.className = "error";

                    message.textContent =
                        data.message ||
                        "Invalid admin credentials.";

                    loginButton.disabled = false;

                    loginButton.textContent =
                        "Login as Administrator";
                }

            }

            catch (error) {

                console.error(error);

                message.className = "error";

                message.textContent =
                    "Unable to connect to the server.";

                loginButton.disabled = false;

                loginButton.textContent =
                    "Login as Administrator";
            }

        });

    </script>

</body>

</html>
