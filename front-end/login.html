<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

body{
    font-family:'Poppins',sans-serif;
    background: url("photo/mciu.jpg") no-repeat center center fixed;
    background-size: cover;
    margin:0;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

body::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.55);
}

.container{
    width:420px;
    background:#fff;
    padding:28px;
    border-radius:14px;
    box-shadow:0 8px 25px rgba(0,0,0,.35);
    position:relative;
    z-index:1;
}

.logo{
    width:65px;
    border-radius:50%;
}

.logo-section{
    text-align:center;
    margin-bottom:15px;
}

h2{
    color:#0b1f3a;
}

.input-group{
    margin-bottom:12px;
}

.input-group input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    background:#d4af37;
    color:white;
    border-radius:10px;
    font-weight:600;
    cursor:pointer;
}

button:hover{
    background:#bc9b30;
}

.msg{
    text-align:center;
    font-size:14px;
    margin-bottom:10px;
}

.success{color:green;}
.error{color:red;}

.links{
    margin-top:15px;
    text-align:center;
    font-size:13px;
}

.links a{
    color:#0b1f3a;
    font-weight:600;
    cursor:pointer;
    text-decoration:none;
}

.reset-box{
    display:none;
    margin-top:12px;
    border-top:1px solid #eee;
    padding-top:12px;
}

.reset-box input{
    width:100%;
    padding:10px;
    margin-top:8px;
    border:1px solid #ddd;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo-section">
        <img src="photo/mciu.jpg" class="logo">
        <h2>Student Login</h2>
    </div>

    <p id="msg" class="msg"></p>

    <form id="loginForm">

        <div class="input-group">
            <input type="text" id="matricNumber" placeholder="Matric Number" required>
        </div>

        <div class="input-group">
            <input type="password" id="password" placeholder="Password" required>
        </div>

        <button type="submit">Login</button>
    </form>

    <div class="links">
        Don’t have an account?
        <a onclick="goRegister()">Register</a>

        <br><br>

        Forgot password?
        <a onclick="toggleReset()">Reset</a>
    </div>

    <div class="reset-box" id="resetBox">
        <input type="text" id="resetMatric" placeholder="Matric Number">
        <input type="password" id="newPassword" placeholder="New Password">
        <button onclick="resetPassword()">Reset Password</button>
    </div>

</div>

<script>

const form = document.getElementById("loginForm");
const msg = document.getElementById("msg");

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const matricNumber = document.getElementById("matricNumber").value;
    const password = document.getElementById("password").value;

    try {
        const res = await fetch("http://localhost:5000/login", {
            method: "POST",
            credentials: "include",   // 🔥 IMPORTANT FIX
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                matric: matricNumber,
                password: password
            })
        });

        const data = await res.json();

        if (data.success) {
            msg.className = "msg success";
            msg.innerText = "Login successful... redirecting";

            setTimeout(() => {
                window.location.href = "dashboard.html";
            }, 800);

        } else {
            msg.className = "msg error";
            msg.innerText = data.message || "Invalid credentials";
        }

    } catch (err) {
        msg.className = "msg error";
        msg.innerText = "Server error";
    }
});

function toggleReset(){
    const box = document.getElementById("resetBox");
    box.style.display = box.style.display === "block" ? "none" : "block";
}

async function resetPassword(){

    const matricNumber = document.getElementById("resetMatric").value;
    const newPassword = document.getElementById("newPassword").value;

    const res = await fetch("reset-password.html", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
            email: matricNumber, // (you should later fix this to real email field)
            newPassword: newPassword,
            confirmPassword: newPassword
        })
    });

    const data = await res.json();

    msg.className = data.success ? "msg success" : "msg error";
    msg.innerText = data.message || "Done";
}

function goRegister(){
    window.location.href = "register.html";
}

</script>

</body>
</html>
