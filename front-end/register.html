<!DOCTYPE html>
<html>
<head>
<title>Register - Hostel Allocation</title>

<style>
body{
    font-family:'Segoe UI',sans-serif;
    background: url("photo/mciu.jpg") no-repeat center center fixed;
    background-size: cover;
    margin:0;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
}

.container{
    width:420px;
    background:#fff;
    padding:25px;
    border-radius:12px;
    position:relative;
    z-index:1;
}

.logo{
    width:70px;
    border-radius:50%;
}

.logo-section{
    text-align:center;
}

.input-group{
    margin-bottom:12px;
}

input, select{
    width:100%;
    padding:10px;
    border:1px solid #ddd;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    background:#d4af37;
    border:none;
    color:#fff;
    border-radius:8px;
    font-weight:600;
}

button:hover{
    background:#bc9b30;
}

.msg{
    text-align:center;
    font-weight:600;
}

.success{color:green;}
.error{color:red;}
</style>
</head>

<body>

<div class="container">

    <div class="logo-section">
        <img src="photo/mciu.jpg" class="logo">
        <h2>Student Registration</h2>
    </div>

    <p id="msg" class="msg"></p>

    <form id="registerForm">

        <input name="name" placeholder="Full Name" required>
        <input name="matric" placeholder="Matric Number" required>
        <input name="email" type="email" placeholder="Email" required>

        <select name="level" required>
            <option value="">Level</option>
            <option>100</option>
            <option>200</option>
            <option>300</option>
            <option>400</option>
            <option>500</option>
        </select>

        <select name="gender" required>
            <option value="">Gender</option>
            <option>Male</option>
            <option>Female</option>
        </select>

        <!-- 🔥 IMPORTANT ADDITIONS -->
        <select name="department">
            <option value="">Department</option>
            <option>Software Engineering</option>
            <option>Computer Science</option>
            <option>Cyber Security</option>
        </select>

        <select name="studentType">
            <option value="Regular">Regular</option>
            <option value="Amnesty">Amnesty</option>
        </select>

        <input name="password" type="password" placeholder="Password" required>

        <button type="submit">Register</button>
<div class="login-link">
    Already have an account?
    <a href="http://localhost:5000/login">Login</a>
</div>
    </form>

</div>

<script>
const form = document.getElementById("registerForm");
const msg = document.getElementById("msg");

form.addEventListener("submit", async (e)=>{
    e.preventDefault();

    const data = {
        name: form.name.value,
        matric: form.matric.value,
        email: form.email.value,
        level: form.level.value,
        gender: form.gender.value,
        department: form.department.value,
        studentType: form.studentType.value,
        password: form.password.value
    };

    const res = await fetch("http://localhost:5000/register", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify(data)
    });

    const result = await res.json();

    if(result.success){
        msg.className="msg success";
        msg.innerText="Registered successfully";

        setTimeout(()=>{
            window.location.href="http://localhost:5000/login";
        },1000);

    }else{
        msg.className="msg error";
        msg.innerText=result.message;
    }
});
</script>

</body>
</html>
